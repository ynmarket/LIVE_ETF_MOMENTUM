name: Run ETF Strategy

on:
  # Manual: GitHub → Actions → Run ETF Strategy → Run workflow
  workflow_dispatch:
    inputs:
      telegram:
        description: "Send Telegram messages for this run"
        type: boolean
        default: true
  # Automatic (GitHub cron is UTC; time below is IST). Off the hour to avoid peak delays.
  # No morning run: it was removed because Yahoo withdraws the previous day's prices
  # overnight for many ETFs, which produced misleading signals.
  schedule:
    - cron: "55 8 * * 1-5"    # ~14:30 IST Mon–Fri — midday update with live prices (set 14:25; GitHub often starts late)
    - cron: "45 14 * * 1-5"   # 20:15 IST Mon–Fri — evening run after NSE close

# One run at a time: a scheduled and a manual run never overlap (the second one waits)
concurrency:
  group: run-etf-strategy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-strategy:
    name: Run strategy and build report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # to commit live_state/entry_decisions.json (entry-day decisions)
    outputs:
      problem: ${{ steps.diagnose.outputs.problem }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # same version the strategy was tested with locally

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || { echo "::error title=Dependency problem::pip could not install requirements.txt"; exit 1; }

      - name: Run strategy
        id: run
        env:
          PYTHONUNBUFFERED: "1"
          # "My Account": read-only access to the Google Sheet of real trades
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Scheduled midday run: never replaces an entry-day choice already saved that day
          RUN_KIND: ${{ github.event.schedule == '55 8 * * 1-5' && 'midday' || '' }}
        run: |
          set +e
          python ETF_Momentum_Test_1.py --force
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0) ;;
            2) echo "::error title=Data download problem::Too few ETFs downloaded from Yahoo Finance (see log above)" ;;
            3) echo "::error title=Excel generation problem::The Excel report could not be written (see log above)" ;;
            4) echo "::error title=HTML generation problem::The HTML report could not be written (see log above)" ;;
            5) echo "::error title=Summary file problem::summary.json could not be written (see log above)" ;;
            *) echo "::error title=Strategy script failed::Python exited with code $code (see traceback above)" ;;
          esac
          exit $code

      - name: Verify reports
        id: verify
        run: |
          html=reports/ETF_Momentum_Test_1_Report.html
          xlsx=reports/ETF_Momentum_Test_1_Report.xlsx
          test -f "$html" || { echo "::error title=File/path problem::$html was not created"; exit 1; }
          size=$(stat -c %s "$html")
          [ "$size" -gt 1000000 ] || { echo "::error title=HTML generation problem::$html is only $size bytes"; exit 1; }
          grep -q "Live Portfolio Dashboard" "$html" || { echo "::error title=HTML generation problem::dashboard title not found in $html"; exit 1; }
          test -f "$xlsx" || { echo "::error title=Excel generation problem::$xlsx was not created"; exit 1; }
          python -c "import json; json.load(open('reports/summary.json'))" || { echo "::error title=Summary file problem::reports/summary.json missing or invalid"; exit 1; }
          test -f reports/ETF_Momentum_Test_1_Report_public.html || { echo "::error title=HTML generation problem::public page missing"; exit 1; }
          if grep -q "My Account — real trades" reports/ETF_Momentum_Test_1_Report_public.html; then
            echo "::error title=Privacy check failed::the public page still contains My Account"; exit 1; fi
          python -c "import json; s=json.load(open('reports/summary_public.json')); assert 'account' not in s" \
            || { echo "::error title=Privacy check failed::summary_public.json contains account data"; exit 1; }
          ls -l reports/

      # The ETFs chosen on the entry day (live_state/entry_decisions.json) are saved by the script;
      # commit them so the evening run (and every later run) records exactly that choice.
      - name: Save entry-day decision
        id: freeze
        run: |
          if [ -n "$(git status --porcelain -- live_state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A live_state
            git commit -m "Save entry-day decision ($(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Entry-day decision committed."
          else
            echo "No new entry-day decision."
          fi

      # The summary currently on GitHub Pages = the last successful run. Used only so the
      # Telegram step does not repeat alerts that were already sent.
      #   With PAGE_PASSWORD set, the published summary is encrypted (summary.json.enc).
      - name: Fetch previously published summary
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"; repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          if [ -n "$PAGE_PASSWORD" ] && curl -fsSL --max-time 20 "${base}/summary.json.enc?run=${GITHUB_RUN_ID}" -o /tmp/prev.enc; then
            python page_crypto.py dec /tmp/prev.enc reports/previous_summary.json \
              || { echo "Previous summary could not be decrypted (password changed?)"; rm -f reports/previous_summary.json; }
          else
            curl -fsSL --max-time 20 "${base}/summary.json?run=${GITHUB_RUN_ID}" -o reports/previous_summary.json \
              || { echo "No previous summary published yet (first run?)"; rm -f reports/previous_summary.json; }
          fi

      # PRIVACY: no report, Excel or plain summary is attached to the run (artifacts of a public
      # repository can be downloaded by any signed-in GitHub user). The Telegram job only receives
      # the summary ENCRYPTED with the Telegram bot token secret, kept for 1 day.
      - name: Encrypt summary for the Telegram job
        if: always()
        env:
          CRYPTO_PASSWORD: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p notify
          if [ -z "$CRYPTO_PASSWORD" ]; then echo "Telegram not configured — nothing to hand over."; exit 0; fi
          if [ -f reports/summary.json ]; then python page_crypto.py enc reports/summary.json notify/summary.json.enc; fi
          if [ -f reports/previous_summary.json ]; then python page_crypto.py enc reports/previous_summary.json notify/previous_summary.json.enc; fi
          ls -l notify/

      - name: Hand over encrypted summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notify-data
          path: notify/
          if-no-files-found: ignore
          retention-days: 1

      - name: Identify problem
        id: diagnose
        if: failure()
        run: |
          if [ "${{ steps.install.outcome }}" = "failure" ]; then p="Python dependency problem"
          elif [ "${{ steps.run.outcome }}" = "failure" ]; then
            case "${{ steps.run.outputs.code }}" in
              2) p="Data download problem (Yahoo Finance)" ;;
              3) p="Excel generation problem" ;;
              4) p="HTML generation problem" ;;
              5) p="Summary file problem" ;;
              *) p="Strategy script error (exit code ${{ steps.run.outputs.code }})" ;;
            esac
          elif [ "${{ steps.verify.outcome }}" = "failure" ]; then p="Report check failed (file/HTML/Excel problem)"
          elif [ "${{ steps.freeze.outcome }}" = "failure" ]; then p="Could not save the entry-day decision (git push)"
          else p="Workflow setup problem"
          fi
          echo "problem=$p" >> "$GITHUB_OUTPUT"
          echo "::error title=Run failed::$p"

      # ── GitHub Pages: publish the SAME report, unchanged, as public/index.html ──
      # These steps only run when everything above succeeded, so a broken or empty
      # report is never published — the previous good report stays online instead.
      # With the PAGE_PASSWORD secret set, the FULL page and summary are published ENCRYPTED
      # (password unlock page). Without it, only the public variants are published: the same
      # dashboard and summary WITHOUT My Account, so real account data is never public.
      - name: Prepare Pages site
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          mkdir -p public
          if [ -n "$PAGE_PASSWORD" ]; then
            python page_crypto.py page reports/ETF_Momentum_Test_1_Report.html public/index.html
            python page_crypto.py enc reports/summary.json public/summary.json.enc
            echo "Published page is password-protected (full dashboard incl. My Account)."
          else
            cp reports/ETF_Momentum_Test_1_Report_public.html public/index.html
            cp reports/summary_public.json public/summary.json
            echo "::warning title=Public page::PAGE_PASSWORD secret not set — published WITHOUT My Account."
          fi
          ls -l public/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy-pages:
    name: Deploy report to GitHub Pages
    needs: run-strategy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    name: Telegram alerts
    needs: [run-strategy, deploy-pages]
    # Scheduled runs always notify; manual runs only when the "telegram" box is ticked
    if: always() && (github.event_name == 'schedule' || inputs.telegram)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install cryptography
        run: pip install "$(grep -E '^cryptography==' requirements.txt)"

      - name: Download encrypted summary
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: notify-data
          path: notify

      - name: Decrypt summary
        env:
          CRYPTO_PASSWORD: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p reports
          if [ -z "$CRYPTO_PASSWORD" ]; then echo "Telegram not configured."; exit 0; fi
          for f in summary previous_summary; do
            if [ -f "notify/$f.json.enc" ]; then python page_crypto.py dec "notify/$f.json.enc" "reports/$f.json"; fi
          done

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_RESULT: ${{ needs.run-strategy.result }}
          DEPLOY_RESULT: ${{ needs.deploy-pages.result }}
          PROBLEM: ${{ needs.run-strategy.outputs.problem }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$RUN_RESULT" != "success" ]; then
            python3 notify_telegram.py --failure "${PROBLEM:-Workflow problem ($RUN_RESULT)}"
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            python3 notify_telegram.py --failure "GitHub Pages deployment problem (the report was generated but not published)"
          else
            case "$SCHEDULE" in
              "45 14 * * 1-5") mode=evening ;;
              "55 8 * * 1-5")  mode=midday ;;
              *)               mode=manual ;;
            esac
            prev=""; [ -f reports/previous_summary.json ] && prev="--previous reports/previous_summary.json"
            python3 notify_telegram.py --summary reports/summary.json $prev --mode "$mode"
          fi

  # GitHub disables scheduled workflows after 60 days without repository activity.
  # Re-enabling the workflow through the API on each scheduled run keeps it active
  # without making any commits.
  keepalive:
    name: Keep schedule active
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/run_strategy.yml/enable"
