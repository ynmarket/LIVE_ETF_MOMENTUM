name: Run ETF Strategy

on:
  # Manual: GitHub → Actions → Run ETF Strategy → Run workflow
  workflow_dispatch:
    inputs:
      telegram:
        description: "Send Telegram messages for this run"
        type: boolean
        default: true
  # Manual runs only — there is no automatic schedule.

# One run at a time: if the workflow is started twice, the second run waits
concurrency:
  group: run-etf-strategy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-strategy:
    name: Run strategy and build report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # to commit live_state/rebalances.json (frozen live rebalances)
    outputs:
      problem: ${{ steps.diagnose.outputs.problem }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # same version the strategy was tested with locally

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || { echo "::error title=Dependency problem::pip could not install requirements.txt"; exit 1; }

      - name: Run strategy
        id: run
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python ETF_Momentum_Test_1.py --force
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0) ;;
            2) echo "::error title=Data download problem::Too few ETFs downloaded from Yahoo Finance (see log above)" ;;
            3) echo "::error title=Excel generation problem::The Excel report could not be written (see log above)" ;;
            4) echo "::error title=HTML generation problem::The HTML report could not be written (see log above)" ;;
            5) echo "::error title=Summary file problem::summary.json could not be written (see log above)" ;;
            *) echo "::error title=Strategy script failed::Python exited with code $code (see traceback above)" ;;
          esac
          exit $code

      - name: Verify reports
        id: verify
        run: |
          html=reports/ETF_Momentum_Test_1_Report.html
          xlsx=reports/ETF_Momentum_Test_1_Report.xlsx
          test -f "$html" || { echo "::error title=File/path problem::$html was not created"; exit 1; }
          size=$(stat -c %s "$html")
          [ "$size" -gt 1000000 ] || { echo "::error title=HTML generation problem::$html is only $size bytes"; exit 1; }
          grep -q "Live Portfolio Dashboard" "$html" || { echo "::error title=HTML generation problem::dashboard title not found in $html"; exit 1; }
          test -f "$xlsx" || { echo "::error title=Excel generation problem::$xlsx was not created"; exit 1; }
          python -c "import json; json.load(open('reports/summary.json'))" || { echo "::error title=Summary file problem::reports/summary.json missing or invalid"; exit 1; }
          ls -l reports/

      # Signals / fills computed from COMPLETE data are frozen by the script; commit them so every
      # later run replays them instead of recomputing from Yahoo (which can withdraw past prices).
      - name: Save frozen rebalances
        id: freeze
        run: |
          if [ -n "$(git status --porcelain -- live_state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live_state/rebalances.json
            git commit -m "Freeze live rebalance data ($(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Frozen rebalances committed."
          else
            echo "No new frozen rebalance."
          fi

      - name: Upload report artifact
        if: always()   # keep whatever was generated, even when a step failed
        uses: actions/upload-artifact@v7
        with:
          name: etf-momentum-report
          path: |
            reports/ETF_Momentum_Test_1_Report.html
            reports/ETF_Momentum_Test_1_Report.xlsx
            reports/summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Identify problem
        id: diagnose
        if: failure()
        run: |
          if [ "${{ steps.install.outcome }}" = "failure" ]; then p="Python dependency problem"
          elif [ "${{ steps.run.outcome }}" = "failure" ]; then
            case "${{ steps.run.outputs.code }}" in
              2) p="Data download problem (Yahoo Finance)" ;;
              3) p="Excel generation problem" ;;
              4) p="HTML generation problem" ;;
              5) p="Summary file problem" ;;
              *) p="Strategy script error (exit code ${{ steps.run.outputs.code }})" ;;
            esac
          elif [ "${{ steps.verify.outcome }}" = "failure" ]; then p="Report check failed (file/HTML/Excel problem)"
          elif [ "${{ steps.freeze.outcome }}" = "failure" ]; then p="Could not save frozen rebalance data (git push)"
          else p="Workflow setup problem"
          fi
          echo "problem=$p" >> "$GITHUB_OUTPUT"
          echo "::error title=Run failed::$p"

      # ── GitHub Pages: publish the SAME report, unchanged, as public/index.html ──
      # These steps only run when everything above succeeded, so a broken or empty
      # report is never published — the previous good report stays online instead.
      - name: Prepare Pages site
        run: |
          mkdir -p public
          cp reports/ETF_Momentum_Test_1_Report.html public/index.html
          cp reports/summary.json public/summary.json
          ls -l public/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy-pages:
    name: Deploy report to GitHub Pages
    needs: run-strategy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    name: Telegram alerts
    needs: [run-strategy, deploy-pages]
    # Runs only when the "Send Telegram messages" box is ticked
    if: always() && inputs.telegram
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download report files
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: etf-momentum-report
          path: reports

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_RESULT: ${{ needs.run-strategy.result }}
          DEPLOY_RESULT: ${{ needs.deploy-pages.result }}
          PROBLEM: ${{ needs.run-strategy.outputs.problem }}
        run: |
          if [ "$RUN_RESULT" != "success" ]; then
            python3 notify_telegram.py --failure "${PROBLEM:-Workflow problem ($RUN_RESULT)}"
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            python3 notify_telegram.py --failure "GitHub Pages deployment problem (the report was generated but not published)"
          else
            python3 notify_telegram.py --summary reports/summary.json
          fi

