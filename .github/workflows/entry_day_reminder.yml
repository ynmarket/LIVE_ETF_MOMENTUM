name: Entry Day Reminder

on:
  # 14:00 IST = 08:30 UTC, on days 1–7 of every month. The script itself checks whether today is
  # the first trading day of the month (NSE data) and stays silent on every other day.
  # Note: GitHub can start scheduled runs some minutes late.
  schedule:
    - cron: "30 8 1-7 * *"
  # Manual test: GitHub → Actions → Entry Day Reminder → Run workflow
  workflow_dispatch:
    inputs:
      force:
        description: "Send a TEST reminder now, even if today is not the entry day"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  remind:
    name: Entry-day reminder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install yfinance
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -E '^yfinance==' requirements.txt)"

      - name: Send reminder if today is the entry day
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python entry_day_reminder.py --force
          else
            python entry_day_reminder.py
          fi

  # GitHub disables scheduled workflows after 60 days without repository activity;
  # re-enabling this workflow on each scheduled run keeps the reminder active.
  keepalive:
    name: Keep schedule active
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/entry_day_reminder.yml/enable"
